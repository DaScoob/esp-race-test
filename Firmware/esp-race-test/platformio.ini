[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp-race-test.ino>
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
